<script>
/* ===== 追加定数 ===== */
const TSUBO = 3.305785;                 // 1坪 = 3.305785㎡
const MAX_UNITS = 12;
const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫'];

const GRADES = [
  { name: 'ローコスト',  tsubo: 65 },
  { name: '標準',        tsubo: 80 },
  { name: 'ハイグレード', tsubo: 100 },
  { name: '高級',        tsubo: 125 },
];
const SELL_TYPES = ['更地分譲', '建売分譲', '一棟', '現況渡し'];
const LEASE_TYPES = ['旧法借地権', '普通借地権', '定期借地権'];

// 物件種別ごとに表示する入力項目
const TYPE_SPEC = {
  '区分マンション': { layout:1, age:1, bldg:1, price:1, income:1 },
  '一棟マンション': { age:1, land:1, bldg:1, bcr:1, price:1, income:1, plans:1 },
  '一棟アパート':   { age:1, land:1, bldg:1, bcr:1, price:1, income:1, plans:1 },
  '戸建て':         { layout:1, age:1, land:1, bldg:1, bcr:1, price:1, income:1, plans:1 },
  '土地':           { land:1, bcr:1, price:1, plans:1 },
  '借地':           { land:1, bcr:1, lease:1, plans:1 },
  'その他':         { layout:1, age:1, land:1, bldg:1, bcr:1, price:1, income:1, plans:1 },
};
const specOf = (type) => TYPE_SPEC[type] || TYPE_SPEC['その他'];

const num = (v) => { if (v == null || v === '') return 0; const n = Number(v); return isNaN(n) ? 0 : n; };
const man = (v) => Math.round(v).toLocaleString();

/* ===== 数値入力の全角→半角変換 =====
   type="number" は日本語IMEをブラウザ側で強制的に無効化してしまい、
   その状態が他の入力欄にも残って「半角固定」になる原因になるため、
   数値系の入力欄は type="text" + inputmode にし、ここで半角化・不正文字除去を行う */
const normalizeNumericStr = (v) => {
  let s = String(v ?? '')
    .replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, '.')
    .replace(/[－ー―‐]/g, '-');
  let sign = '';
  if (s[0] === '-') { sign = '-'; s = s.slice(1); }
  s = s.replace(/[^0-9.]/g, '');
  const dot = s.indexOf('.');
  if (dot !== -1) s = s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, '');
  return sign + s;
};
function sanitizeNumericInput(el) {
  const before = el.value;
  const after = normalizeNumericStr(before);
  if (after === before) return;
  const start = el.selectionStart ?? after.length;
  const diff = before.length - after.length;
  el.value = after;
  const pos = Math.max(0, start - diff);
  try { el.setSelectionRange(pos, pos); } catch (e) {}
}
// キャプチャフェーズで document に仕込むことで、各入力欄に個別にバインドされた
// input リスナー(保存処理など)が値を読む前に半角化を済ませておく
document.addEventListener('input', (e) => {
  if (e.target && e.target.matches && e.target.matches('input.jsnum')) sanitizeNumericInput(e.target);
}, true);

// 表示・並び替え用の代表面積（土地系は土地面積、区分は建物面積）
const areaOf = (p) => {
  const s = specOf(p.type);
  if (s.land && num(p.landArea)) return num(p.landArea);
  if (s.bldg && num(p.bldgArea)) return num(p.bldgArea);
  return num(p.landArea) || num(p.bldgArea) || num(p.area);
};
// 借地は「借地権価格＋建物価格」を総額とみなす
const priceOf = (p) => {
  if (p.type === '借地') {
    const t = num(p.leaseValue) + num(p.bldgValue);
    return t > 0 ? t : num(p.price);
  }
  return num(p.price);
};
const walkOf = (p) => {
  const mins = (p.stations || []).map(s => num(s.min)).filter(v => v > 0);
  return mins.length ? Math.min(...mins) : null;
};
const stationLabel = (p) => (p.stations || [])
  .filter(s => s.name)
  .map(s => `${s.name}${s.min ? ' 徒歩' + s.min + '分' : ''}`)
  .join(' / ');

/* ===== 企画検討の計算 ===== */
function planCalc(prop, plan) {
  const units = Math.min(MAX_UNITS, Math.max(1, parseInt(plan.units) || 1));
  const lots = (plan.lots || []).slice(0, units);
  const landSum  = lots.reduce((s, l) => s + num(l.land), 0);
  const floorSum = lots.reduce((s, l) => s + num(l.floor), 0);
  const revenue  = lots.reduce((s, l) => s + num(l.price), 0);

  const totalLand = areaOf(prop);
  const roadArea = totalLand > 0 ? totalLand - landSum : 0;

  const noBuild = plan.sellType === '更地分譲' || plan.sellType === '現況渡し';
  const tsuboUnit = num(plan.tsuboUnit);
  const buildCost = noBuild ? 0 : (floorSum / TSUBO) * tsuboUnit;

  const landCost = priceOf(prop);
  const devCost = num(plan.devCost);
  const cost = landCost + buildCost + devCost;
  const profit = revenue - cost;
  const margin = revenue > 0 ? (profit / revenue * 100) : null;

  return { units, lots, landSum, floorSum, revenue, totalLand, roadArea,
           noBuild, buildCost, landCost, devCost, cost, profit, margin };
}
const sortedPlans = (p) => (p.plans || [])
  .map((pl, i) => ({ pl, i, c: planCalc(p, pl) }));
const bestPlan = (p) => { const l = sortedPlans(p); return l.find(x => x.pl.adopted) || l[0] || null; };

// 2点間の距離(m) — 駅からの半径検索用
function distanceM(lat1, lng1, lat2, lng2) {
  const R = 6371000, rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad, dLng = (lng2 - lng1) * rad;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*rad) * Math.cos(lat2*rad) * Math.sin(dLng/2)**2;
  return 2 * R * Math.asin(Math.sqrt(a));
}

/* ===== バックアップ ===== */
const BK_LATEST = 'rem_bk_latest';
const BK_GENS   = 'rem_bk_gens';
const BK_LAST   = 'rem_bk_lastfile';

const lightCopy = (list) => list.map(({ attachments, ...rest }) => rest);

// Firestore同期のたびに呼ばれる。データが消えた場合は世代を上書きしない
function autoBackup(list) {
  try {
    const slim = lightCopy(list);
    const prev = JSON.parse(localStorage.getItem(BK_LATEST) || 'null');
    localStorage.setItem(BK_LATEST, JSON.stringify({ ts: Date.now(), count: slim.length, data: slim }));

    // 件数が激減したときは世代バックアップを守る(誤削除対策)
    if (prev && prev.count > 0 && slim.length < prev.count * 0.5) {
      console.warn('件数が大幅に減少したため世代バックアップは更新しません');
      setSyncStatus('⚠ 件数が減少 — 復元可能', '#b45309');
      return;
    }
    const gens = JSON.parse(localStorage.getItem(BK_GENS) || '[]');
    const today = new Date().toISOString().slice(0, 10);
    const entry = { date: today, ts: Date.now(), count: slim.length, data: slim };
    if (gens.length && gens[gens.length - 1].date === today) gens[gens.length - 1] = entry;
    else gens.push(entry);
    while (gens.length > 5) gens.shift();
    localStorage.setItem(BK_GENS, JSON.stringify(gens));
  } catch (e) {
    console.warn('自動バックアップ失敗:', e);
  }
}

// 完全バックアップ(添付込み)をJSONで書き出す
function downloadBackup() {
  const payload = {
    app: 'realestate-map', version: 2,
    exportedAt: new Date().toISOString(),
    count: properties.length,
    properties: properties,
  };
  const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  localStorage.setItem(BK_LAST, String(Date.now()));
  updateBackupWarning();
}

async function restoreList(list, label) {
  if (!list || !list.length) { alert('復元できるデータがありません'); return; }
  if (!confirm(`${label}\n${list.length}件を復元します。\n同じ物件名+住所の既存データは上書きされます。よろしいですか?`)) return;
  setSyncStatus('復元中...', '#c9a961');
  const byKey = new Map(properties.map(p => [`${p.name}|${p.address}`, p]));
  let ok = 0;
  for (const item of list) {
    const exist = byKey.get(`${item.name}|${item.address}`);
    const data = { ...item, id: exist ? exist.id : (item.id || String(Date.now() + Math.random())) };
    if (await savePropertyToFirestore(data)) ok++;
  }
  setSyncStatus('● 同期済み', '#1D9E75');
  alert(`${ok}件を復元しました`);
}

  return v.toLocaleString() + '万円';
};

const formatDate = (iso) => {

  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
};

const formatDateTime = (iso) => {

  if (isNaN(d.getTime())) return '';
  return `${formatDate(iso)} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
};

async function savePropertyToFirestore(p) {
  if (!currentUserId || !window.fbDb) {
    console.warn('Firebase未接続のため保存をスキップ');
    return false;
  }
  try {
    const { collection, doc, setDoc } = window.fbHelpers;
    const docRef = doc(window.fbDb, 'users', currentUserId, 'properties', p.id);
    await setDoc(docRef, stripAttachments(p));

    // 写真は別途ローカルに保存
    const photos = loadPhotos();
    if (p.attachments && p.attachments.length > 0) {
      photos[p.id] = p.attachments;
    } else {
      delete photos[p.id];
    }
    savePhotos(photos);
    return true;
  } catch(e) {
    console.error('Firestore保存エラー:', e);
    setSyncStatus('保存エラー', '#b91c1c');
    return false;
  }
}

function setupMapSearch() {
  const input = document.getElementById('map-search-input');
  const clearBtn = document.getElementById('map-search-clear');

  // Places Autocomplete を設定
  const autocomplete = new google.maps.places.Autocomplete(input, {
    fields: ['geometry', 'name', 'formatted_address'],
    componentRestrictions: { country: 'jp' },
  });

  autocomplete.addListener('place_changed', () => {
    const place = autocomplete.getPlace();
    if (!place.geometry || !place.geometry.location) return;
    moveToSearchResult(place.geometry.location, place.name || place.formatted_address);
  });

  // Enterキーで地名・住所検索(Autocompleteの候補を選んでない場合のフォールバック)
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      setTimeout(() => {
        const query = input.value.trim();
        if (!query) return;
        // すでにAutocompleteで処理されているか確認するため、少し遅延
        if (!searchMarker || searchMarker.title !== query) {
          geocoder.geocode({ address: query, region: 'JP' }, (results, status) => {
            if (status === 'OK' && results[0]) {
              moveToSearchResult(results[0].geometry.location, results[0].formatted_address);
            }
          });
        }
      }, 200);
    }
  });

  input.addEventListener('input', () => {
    clearBtn.style.display = input.value ? 'inline-block' : 'none';
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    clearBtn.style.display = 'none';
    if (searchMarker) { searchMarker.setMap(null); searchMarker = null; }
    radiusCenter = null;

}

function geocode(address) {
  return new Promise((resolve) => {
    if (!address || !geocoder) { resolve(null); return; }
    geocoder.geocode({ address, region: 'JP' }, (results, status) => {
      if (status === 'OK' && results && results[0]) {
        const loc = results[0].geometry.location;
        resolve({ lat: loc.lat(), lng: loc.lng() });
      } else {
        resolve(null);
      }
    });
  });
}

            fill="${meta.color}" fill-opacity="0.35" stroke="${meta.color}" stroke-width="1.8" stroke-dasharray="3,2"/>
          ${isSel ? `<circle cx="18" cy="18" r="3.5" fill="${meta.color}"/>` : ''}
        </svg>
      `;
    } else if (status === 'listed') {
      // 濃いピン: 通常の塗りつぶし
      svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size + 4}" viewBox="0 0 36 40">
          <path d="M18 0 C8 0 0 8 0 18 C0 28 18 40 18 40 C18 40 36 28 36 18 C36 8 28 0 18 0 Z"
            fill="${meta.color}" stroke="#fff" stroke-width="2"/>
          ${isSel ? `<circle cx="18" cy="18" r="4" fill="#fff"/>` : ''}
        </svg>
      `;
    } else {
      // 成約: 二重リング付き濃いピン + チェック
      svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="${size + 8}" height="${size + 12}" viewBox="0 0 44 48">
          <circle cx="22" cy="22" r="21" fill="none" stroke="${meta.color}" stroke-width="1.5" stroke-opacity="0.4"/>
          <path d="M22 4 C12 4 4 12 4 22 C4 32 22 44 22 44 C22 44 40 32 40 22 C40 12 32 4 22 4 Z"
            fill="${meta.color}" stroke="#fff" stroke-width="2"/>
          <path d="M16 21 L20 25 L28 17" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      `;
    }

    const finalW = status === 'closed' ? size + 8 : size;
    const finalH = status === 'closed' ? size + 12 : size + 4;

    const marker = new google.maps.Marker({
      position: { lat: p.lat, lng: p.lng },
      map,
      title: `${p.name}${status !== 'consulting' ? ' [' + statusMeta(status).short + ']' : ''}`,
      icon: {
        url: 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(svg),
        scaledSize: new google.maps.Size(finalW, finalH),
        anchor: new google.maps.Point(finalW / 2, finalH),
      },
      zIndex: isSel ? 1000 : (status === 'closed' ? 200 : status === 'listed' ? 150 : 100),
    });

    marker.addListener('click', () => selectProperty(p.id));
    markers[p.id] = marker;
  });

  // 表示対象の物件セットが変わったときだけ全体フィットする。
  // （詳細カードを閉じただけ・選択を外しただけでは勝手にズームアウトしない）
  const fitKey = withCoords.map(p => p.id).join(',');
  if (!selectedId && fitKey !== lastFitKey) {
    if (withCoords.length > 1) {
      const bounds = new google.maps.LatLngBounds();
      withCoords.forEach(p => bounds.extend({ lat: p.lat, lng: p.lng }));
      map.fitBounds(bounds, 60);
    } else if (withCoords.length === 1) {
      map.setCenter({ lat: withCoords[0].lat, lng: withCoords[0].lng });
      map.setZoom(15);
    }
  }
  lastFitKey = fitKey;

  document.getElementById('empty-hint').style.display = properties.length === 0 ? 'block' : 'none';
}

function fitAll() {
  if (!map) return;
  const withCoords = filtered().filter(p => p.lat != null && p.lng != null);
  if (withCoords.length === 0) return;
  if (withCoords.length === 1) {
    map.setCenter({ lat: withCoords[0].lat, lng: withCoords[0].lng });
    map.setZoom(15);
    return;
  }
  const bounds = new google.maps.LatLngBounds();
  withCoords.forEach(p => bounds.extend({ lat: p.lat, lng: p.lng }));
  map.fitBounds(bounds, 60);
}

// CSVを安全にパース(ダブルクォート対応)
function parseCSV(text) {
  // BOM除去
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const rows = [];
  let cur = [];
  let field = '';
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if (c === '"') {
        inQuotes = true;
      } else if (c === ',') {
        cur.push(field); field = '';
      } else if (c === '\n') {
        cur.push(field); rows.push(cur); cur = []; field = '';
      } else if (c === '\r') {
        // skip
      } else {
        field += c;
      }
    }
  }
  if (field !== '' || cur.length > 0) { cur.push(field); rows.push(cur); }
  return rows.filter(r => r.some(v => v && v !== ''));
}

function parseDate(s) {
  if (!s) return null;
  const m = s.match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
  if (m) {
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    return d.toISOString();
  }
  return null;
}

        <input type="text" inputmode="numeric" class="st-min jsnum" data-si="${i}" value="${escapeHtml(s.min || '')}" placeholder="分">
        <button type="button" class="plan-del st-del" data-si="${i}" title="削除">×</button>
      </div>`).join('');
    wrap.querySelectorAll('input').forEach(el => el.addEventListener('input', () => {
      const i = +el.dataset.si;
      const key = el.classList.contains('st-line') ? 'line' : el.classList.contains('st-name') ? 'name' : 'min';
      workingStations[i][key] = el.value;
    }));
    wrap.querySelectorAll('.st-del').forEach(el => el.addEventListener('click', () => {
      workingStations.splice(+el.dataset.si, 1);
      if (!workingStations.length) workingStations.push({ line:'', name:'', min:'' });
      renderStations();
    }));
  }
  document.getElementById('st-add').addEventListener('click', () => {
    if (workingStations.length >= 4) { alert('路線は4つまでです'); return; }
    workingStations.push({ line:'', name:'', min:'' });
    renderStations();
  });

  /* --- 企画検討 --- */
  const propForCalc = () => ({
    type: typeSel.value,
    landArea: document.getElementById('f-land')?.value,
    bldgArea: document.getElementById('f-bldg')?.value,
    area: '',
    price: document.getElementById('f-price')?.value,
    leaseValue: document.getElementById('f-lease-value')?.value,
    bldgValue: document.getElementById('f-bldg-value')?.value,
  });

  function lotsHtml(pl, i) {
    const units = Math.min(MAX_UNITS, Math.max(1, parseInt(pl.units) || 1));
    const noBuild = pl.sellType === '更地分譲' || pl.sellType === '現況渡し';
    let out = `<div class="lot-head"><span></span><span>土地 ㎡</span><span>延床 ㎡</span><span>売価 万円</span></div>`;
    for (let u = 0; u < units; u++) {
      const l = (pl.lots || [])[u] || {};
      out += `<div class="lot-row">
        <span class="lot-no">${CIRCLED[u]}</span>
        <input type="text" inputmode="decimal" class="lot-land jsnum"  data-pi="${i}" data-ui="${u}" value="${escapeHtml(l.land ?? '')}">
        <input type="text" inputmode="decimal" class="lot-floor jsnum" data-pi="${i}" data-ui="${u}" value="${escapeHtml(l.floor ?? '')}" ${noBuild ? 'disabled' : ''}>
        <input type="text" inputmode="numeric" class="lot-price jsnum" data-pi="${i}" data-ui="${u}" value="${escapeHtml(l.price ?? '')}">
      </div>`;
    }
    return out;
  }

  function planResultHtml(pl) {
    const c = planCalc(propForCalc(), pl);
    const roadTxt = c.totalLand > 0
      ? (c.roadArea >= 0
          ? `区画計 ${c.landSum.toFixed(1)}㎡ / 道路・潰れ地 ${c.roadArea.toFixed(1)}㎡`
          : `<span class="neg">区画計が土地面積を ${Math.abs(c.roadArea).toFixed(1)}㎡ 超過</span>`)
      : '';
    return `${roadTxt ? roadTxt + '<br>' : ''}
      <span class="big">土地の売値 ${man(c.revenue)}万</span>${c.buildCost > 0 ? ` ／ 建築費 ${man(c.buildCost)}万` : ''}
      ${c.floorSum > 0 ? `<br><span style="opacity:.7">総延床 ${c.floorSum.toFixed(1)}㎡ (${(c.floorSum/TSUBO).toFixed(1)}坪)</span>` : ''}`;
  }

  function planAutoHtml(pl) {
    const pr = propForCalc();
    const land = areaOf(pr), far = num(document.getElementById('f-far')?.value);
    if (land <= 0 || far <= 0) return '';
    const units = Math.max(1, parseInt(pl.units) || 1);
    return `容積率いっぱいなら 全体${(land * far / 100).toFixed(1)}㎡ ／ 1区画あたり約 <strong>${(land * far / 100 / units).toFixed(1)}㎡</strong> <a data-plan-fill="1">← 各区画に入れる</a>`;
  }

  const updateResult = (i) => { const el = document.querySelector(`.plan-result[data-pi="${i}"]`); if (el) el.innerHTML = planResultHtml(workingPlans[i]); };
  const updateAuto   = (i) => { const el = document.querySelector(`.plan-auto[data-pi="${i}"]`);   if (el) el.innerHTML = planAutoHtml(workingPlans[i]); };
  function updateAllPlans() { workingPlans.forEach((_, i) => { updateResult(i); updateAuto(i); }); }

  function bindLots(scope) {
    scope.querySelectorAll('.lot-land, .lot-floor, .lot-price').forEach(el => el.addEventListener('input', () => {
      const i = +el.dataset.pi, u = +el.dataset.ui;
      if (!workingPlans[i].lots) workingPlans[i].lots = [];
      while (workingPlans[i].lots.length <= u) workingPlans[i].lots.push({ land:'', floor:'', price:'' });
      const key = el.classList.contains('lot-land') ? 'land' : el.classList.contains('lot-floor') ? 'floor' : 'price';
      workingPlans[i].lots[u][key] = el.value;
      updateResult(i);
    }));
  }

  function renderPlans() {
    const wrap = document.getElementById('plans-wrap');
    if (!wrap) return;
    if (!workingPlans.length) {
      wrap.innerHTML = `<div class="hint" style="margin-top:8px">「＋ パターン追加」で 3分割案・4分割案・更地のまま売る案などを並べて比較できます。</div>`;
      return;
    }
    wrap.innerHTML = workingPlans.map((pl, i) => `
      <div class="plan-card ${pl.adopted ? 'adopted' : ''}" data-pi="${i}">
        <div class="plan-card-head">
          <input type="text" class="plan-name" data-pi="${i}" value="${escapeHtml(pl.name || '')}" placeholder="例: 3分割案">
          <label class="plan-adopt"><input type="radio" name="plan-adopt" class="plan-adopt-radio" data-pi="${i}" ${pl.adopted ? 'checked' : ''}>採用</label>
          <button type="button" class="plan-del" data-pi="${i}" title="削除">×</button>
        </div>
        <div class="plan-grid2">
          <div><label class="mini">売り方</label>
            <select class="plan-sell" data-pi="${i}">
              ${SELL_TYPES.map(s => `<option value="${s}" ${pl.sellType === s ? 'selected' : ''}>${s}</option>`).join('')}
            </select></div>
          <div><label class="mini">区画数</label>
            <input type="text" inputmode="numeric" class="plan-units jsnum" data-pi="${i}" value="${escapeHtml(pl.units || 1)}"></div>
        </div>
        <div class="plan-grid2 plan-build-row" ${(pl.sellType === '更地分譲' || pl.sellType === '現況渡し') ? 'style="display:none"' : ''}>
          <div><label class="mini">建物グレード</label>
            <select class="plan-grade" data-pi="${i}">
              ${GRADES.map(g => `<option value="${g.name}" ${pl.grade === g.name ? 'selected' : ''}>${g.name} (${g.tsubo}万/坪)</option>`).join('')}
              <option value="カスタム" ${pl.grade === 'カスタム' ? 'selected' : ''}>カスタム</option>
            </select></div>
          <div><label class="mini">建築費 (万円/坪)</label>
            <input type="text" inputmode="numeric" class="plan-tsubo jsnum" data-pi="${i}" value="${escapeHtml(pl.tsuboUnit ?? '')}"></div>
        </div>
        <div class="plan-auto" data-pi="${i}">${planAutoHtml(pl)}</div>
        <label class="mini">区画別の内訳</label>
        <div class="plan-lots" data-pi="${i}">${lotsHtml(pl, i)}</div>
        <label class="mini">造成費 (万円) <span style="font-weight:400;opacity:.7">分筆・測量・道路築造・解体など</span></label>
        <input type="text" inputmode="numeric" class="plan-dev jsnum" data-pi="${i}" value="${escapeHtml(pl.devCost ?? '')}" placeholder="800">
        <div class="plan-result" data-pi="${i}">${planResultHtml(pl)}</div>
      </div>`).join('');

    wrap.querySelectorAll('.plan-name').forEach(el => el.addEventListener('input', () => { workingPlans[+el.dataset.pi].name = el.value; }));
    wrap.querySelectorAll('.plan-dev').forEach(el => el.addEventListener('input', () => { workingPlans[+el.dataset.pi].devCost = el.value; updateResult(+el.dataset.pi); }));
    wrap.querySelectorAll('.plan-tsubo').forEach(el => el.addEventListener('input', () => {
      const i = +el.dataset.pi; workingPlans[i].tsuboUnit = el.value; workingPlans[i].grade = 'カスタム';
      const g = wrap.querySelector(`.plan-grade[data-pi="${i}"]`); if (g) g.value = 'カスタム';
      updateResult(i);
    }));
    wrap.querySelectorAll('.plan-grade').forEach(el => el.addEventListener('change', () => {
      const i = +el.dataset.pi; workingPlans[i].grade = el.value;
      const g = GRADES.find(x => x.name === el.value);
      if (g) { workingPlans[i].tsuboUnit = g.tsubo; const t = wrap.querySelector(`.plan-tsubo[data-pi="${i}"]`); if (t) t.value = g.tsubo; }
      updateResult(i);
    }));
    wrap.querySelectorAll('.plan-sell').forEach(el => el.addEventListener('change', () => {
      const i = +el.dataset.pi; workingPlans[i].sellType = el.value; renderPlans();
    }));
    wrap.querySelectorAll('.plan-units').forEach(el => el.addEventListener('change', () => {
      const i = +el.dataset.pi;
      const u = Math.min(MAX_UNITS, Math.max(1, parseInt(el.value) || 1));
      el.value = u; workingPlans[i].units = u;
      const box = wrap.querySelector(`.plan-lots[data-pi="${i}"]`);
      if (box) { box.innerHTML = lotsHtml(workingPlans[i], i); bindLots(box); }
      updateResult(i); updateAuto(i);
    }));
    wrap.querySelectorAll('.plan-adopt-radio').forEach(el => el.addEventListener('change', () => {
      const i = +el.dataset.pi;
      workingPlans.forEach((pl, j) => { pl.adopted = (j === i); });
      wrap.querySelectorAll('.plan-card').forEach(c => c.classList.toggle('adopted', +c.dataset.pi === i));
    }));
    wrap.querySelectorAll('.plan-del').forEach(el => el.addEventListener('click', () => {
      if (!confirm('このパターンを削除しますか?')) return;
      workingPlans.splice(+el.dataset.pi, 1); renderPlans();
    }));
    bindLots(wrap);
  }

  // 「各区画に入れる」は再描画されるのでイベント委譲
  document.getElementById('plans-wrap').addEventListener('click', (e) => {
    const a = e.target.closest('a[data-plan-fill]');
    if (!a) return;
    const i = +a.closest('.plan-auto').dataset.pi;
    const pr = propForCalc();
    const land = areaOf(pr), far = num(document.getElementById('f-far').value);
    if (land <= 0 || far <= 0) return;
    const pl = workingPlans[i];
    const units = Math.max(1, parseInt(pl.units) || 1);
    const per = (land * far / 100 / units).toFixed(2);
    const perLand = (land / units).toFixed(2);
    pl.lots = pl.lots || [];
    for (let u = 0; u < units; u++) {
      if (!pl.lots[u]) pl.lots[u] = { land:'', floor:'', price:'' };
      if (!pl.lots[u].land) pl.lots[u].land = perLand;
      if (!pl.lots[u].floor) pl.lots[u].floor = per;
    }
    renderPlans();
  });

  document.getElementById('plan-add').addEventListener('click', () => {
    if (workingPlans.length >= 6) { alert('パターンは6つまでです'); return; }
    const defaults = [3, 4, 1, 2, 5, 6];
    const u = defaults[workingPlans.length] || 3;
    workingPlans.push({
      name: u === 1 ? '一棟案' : `${u}分割案`, sellType: '更地分譲',
      grade: '標準', tsuboUnit: 80, devCost: '', units: u,
      lots: [], adopted: workingPlans.length === 0,
    });
    renderPlans();
  });

  ['f-price','f-land','f-bldg','f-far'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.addEventListener('input', updateAllPlans);
  });

  /* --- 添付 --- */
  function renderAttachmentsPreview() {
    const el = document.getElementById('attachments-preview');
    el.innerHTML = workingAttachments.map((a, i) => a.type && a.type.startsWith('image/')
      ? `<div class="attachment-item"><img src="${a.data}" alt="${escapeHtml(a.name)}" />
           <button class="attachment-remove" data-rm-idx="${i}" type="button">×</button></div>`
      : `<div class="attachment-item pdf"><div class="pdf-icon">📄</div><div class="pdf-name">${escapeHtml(a.name)}</div>
           <button class="attachment-remove" data-rm-idx="${i}" type="button">×</button></div>`).join('');
    el.querySelectorAll('[data-rm-idx]').forEach(b => b.addEventListener('click', () => {
      workingAttachments.splice(+b.dataset.rmIdx, 1); renderAttachmentsPreview();
    }));
  }
  function readFile(file) {
    return new Promise((resolve) => {
      const r = new FileReader();
      r.onload = () => resolve({ name: file.name, type: file.type, data: r.result });
      r.onerror = () => resolve(null);
      r.readAsDataURL(file);
    });
  }
  async function handleFiles(files) {
    const status = document.getElementById('form-status');
    for (const file of files) {
      if (file.size > 10 * 1024 * 1024) { status.textContent = `${file.name} は10MBを超えるためスキップしました`; continue; }
      const att = await readFile(file);
      if (att) workingAttachments.push(att);
    }
    renderAttachmentsPreview();
    status.textContent = '';
  }
  const dropZone = document.getElementById('drop-zone');
  document.getElementById('f-files').addEventListener('change', (e) => handleFiles(e.target.files));
  dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });

  renderStations();
  renderPlans();
  renderAttachmentsPreview();
  applyTypeSpec();

  /* --- 保存 --- */
  const close = () => { mount.innerHTML = ''; };
  document.getElementById('form-close-x').onclick = close;
  document.getElementById('form-cancel').onclick = close;
  document.getElementById('form-save').onclick = async () => {
    const now = new Date().toISOString();
    const type = document.getElementById('f-type').value;
    const s = specOf(type);
    const land = document.getElementById('f-land').value;
    const bldg = document.getElementById('f-bldg').value;
    const leaseValue = document.getElementById('f-lease-value').value;
    const bldgValue  = document.getElementById('f-bldg-value').value;

    const data = {
      ...(isEdit ? { id: p.id, createdAt: p.createdAt || now } : { createdAt: now }),
      updatedAt: now,
      name: document.getElementById('f-name').value.trim(),
      address: document.getElementById('f-address').value.trim(),
      agent: document.getElementById('f-agent').value.trim(),
      status: workingStatus,
      type,
      layout: s.layout ? document.getElementById('f-layout').value : '',
      age: s.age ? document.getElementById('f-age').value : '',
      landArea: s.land ? land : '',
      bldgArea: s.bldg ? bldg : '',
      bcr: s.bcr ? document.getElementById('f-bcr').value : '',
      far: s.bcr ? document.getElementById('f-far').value : '',
      price: s.lease ? String(num(leaseValue) + num(bldgValue)) : (s.price ? document.getElementById('f-price').value : ''),
      leaseValue: s.lease ? leaseValue : '',
      bldgValue:  s.lease ? bldgValue  : '',
      groundRent: s.lease ? document.getElementById('f-ground-rent').value : '',
      leaseYears: s.lease ? document.getElementById('f-lease-years').value : '',
      leaseType:  s.lease ? document.getElementById('f-lease-type').value : '',
      monthlyRent: s.income ? document.getElementById('f-rent').value : '',
      yield:       s.income ? document.getElementById('f-yield').value : '',
      stations: workingStations.filter(x => (x.name || '').trim() || (x.line || '').trim())
        .map(x => ({ line: (x.line||'').trim(), name: (x.name||'').trim(), min: x.min || '' })),
      plans: s.plans ? workingPlans.map(pl => {
        const u = Math.min(MAX_UNITS, Math.max(1, parseInt(pl.units) || 1));
        return {
          name: pl.name || '', sellType: pl.sellType || '建売分譲',
          grade: pl.grade || '標準', tsuboUnit: pl.tsuboUnit ?? '', devCost: pl.devCost ?? '',
          units: u,
          lots: Array.from({ length: u }, (_, k) => ({
            land:  (pl.lots?.[k]?.land)  ?? '',
            floor: (pl.lots?.[k]?.floor) ?? '',
            price: (pl.lots?.[k]?.price) ?? '',
          })),
          adopted: !!pl.adopted,
        };
      }) : [],
      memo: document.getElementById('f-memo').value,
      attachments: workingAttachments,
      lat: isEdit ? p.lat : null,
      lng: isEdit ? p.lng : null,
    };
    // 並び替え・CSV互換のため代表面積を保持
    data.area = s.land ? (land || bldg) : (bldg || land);

    if (!data.name || !data.address) { alert('物件名と住所は必須です'); return; }

    const status = document.getElementById('form-status');
    const saveBtn = document.getElementById('form-save');
    saveBtn.disabled = true;

    if (!isEdit || p.address !== data.address) {
      status.textContent = '住所から位置を取得中...';
      const coords = await geocode(data.address);
      if (coords) { data.lat = coords.lat; data.lng = coords.lng; }
    }
    if (isEdit) properties = properties.map(x => x.id === data.id ? data : x);
    else { data.id = Date.now().toString(); properties.push(data); }

    if (!await savePropertyToFirestore(data)) {
      alert('保存に失敗しました。インターネット接続を確認してください。');
      saveBtn.disabled = false;
      return;
    }
    selectedId = data.id;
    close(); render(); syncMarkers(); panToSelected();
    if (!data.lat || !data.lng) setTimeout(() => alert('住所から位置が見つかりませんでした。住所を確認してください。'), 200);
  };
}

/* ===== 絞り込み状態 ===== */
let filterSort = 'updated';
let filterPriceMin = '', filterPriceMax = '';
let filterAreaMin = '', filterAreaMax = '';
let filterWalk = '';
let filterInBounds = false;
let radiusM = 0;              // 駅からの半径 (0=オフ)
let radiusCenter = null;      // {lat, lng, label}
let radiusCircle = null;

function readFilterInputs() {
  const v = (id) => (document.getElementById(id)?.value ?? '').trim();
  filterText     = v('search-input').toLowerCase();
  filterType     = v('type-filter');
  filterStatus   = v('status-filter');
  filterSort     = v('sort-select') || 'updated';
  filterPriceMin = v('f-price-min');
  filterPriceMax = v('f-price-max');
  filterAreaMin  = v('f-area-min');
  filterAreaMax  = v('f-area-max');
  filterWalk     = v('f-walk-max');
  filterInBounds = !!document.getElementById('f-in-bounds')?.checked;
  radiusM        = Number(v('radius-select') || 0);
}

function clearFilters() {
  ['search-input','f-price-min','f-price-max','f-area-min','f-area-max','f-walk-max']
    .forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  ['type-filter','status-filter'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
  const s = document.getElementById('sort-select'); if (s) s.value = 'updated';
  const b = document.getElementById('f-in-bounds'); if (b) b.checked = false;
  const r = document.getElementById('radius-select'); if (r) r.value = '0';
  readFilterInputs(); updateRadiusCircle(); render(); syncMarkers();
}

function filtered() {
  const t = filterText;
  let bounds = null;
  if (filterInBounds && map && map.getBounds) bounds = map.getBounds();

  let list = properties.filter(p => {
    if (t) {
      const hay = [p.name, p.address, p.agent, p.memo, stationLabel(p)]
        .filter(Boolean).join(' ').toLowerCase();
      if (!hay.includes(t)) return false;
    }
    if (filterType && p.type !== filterType) return false;
    if (filterStatus && statusOf(p) !== filterStatus) return false;

    const pr = priceOf(p);
    if (filterPriceMin && pr < Number(filterPriceMin)) return false;
    if (filterPriceMax && (pr === 0 || pr > Number(filterPriceMax))) return false;

    const ar = areaOf(p);
    if (filterAreaMin && ar < Number(filterAreaMin)) return false;
    if (filterAreaMax && (ar === 0 || ar > Number(filterAreaMax))) return false;

    if (filterWalk) { const w = walkOf(p); if (w == null || w > Number(filterWalk)) return false; }

    if (bounds && p.lat && p.lng && !bounds.contains(new google.maps.LatLng(p.lat, p.lng))) return false;

    if (radiusM > 0 && radiusCenter) {
      if (!p.lat || !p.lng) return false;
      if (distanceM(radiusCenter.lat, radiusCenter.lng, p.lat, p.lng) > radiusM) return false;
    }
    return true;
  });

  const byNum = (f) => (a, b) => f(b) - f(a);
  switch (filterSort) {
    case 'created':    list.sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||'')); break;
    case 'price_desc': list.sort(byNum(priceOf)); break;
    case 'price_asc':  list.sort((a,b) => (priceOf(a)||Infinity) - (priceOf(b)||Infinity)); break;
    case 'area_desc':  list.sort(byNum(areaOf)); break;
    case 'walk_asc':   list.sort((a,b) => (walkOf(a) ?? 999) - (walkOf(b) ?? 999)); break;
    case 'name':       list.sort((a,b) => (a.name||'').localeCompare(b.name||'', 'ja')); break;
    default:           list.sort((a,b) => (b.updatedAt||'').localeCompare(a.updatedAt||''));
  }
  return list;
}

function updateRadiusCircle() {
  if (radiusCircle) { radiusCircle.setMap(null); radiusCircle = null; }
  if (!map || !radiusM || !radiusCenter) return;
  radiusCircle = new google.maps.Circle({
    map, center: { lat: radiusCenter.lat, lng: radiusCenter.lng }, radius: radiusM,
    strokeColor: '#c9a961', strokeOpacity: 0.9, strokeWeight: 2,
    fillColor: '#c9a961', fillOpacity: 0.10, clickable: false, zIndex: 1,
  });
}

function updateRadiusUI() {
  const box = document.getElementById('radius-box');
  const lbl = document.getElementById('radius-label');
  if (!box) return;
  box.style.display = radiusCenter ? '' : 'none';
  if (lbl && radiusCenter) lbl.textContent = radiusCenter.label || '検索地点';
}

/* ===== 一覧 ===== */
function renderList() {
  const list = filtered();
  const el = document.getElementById('property-list');
  const cnt = document.getElementById('filter-count');
  if (cnt) cnt.textContent = `${list.length} / ${properties.length} 件`;

  if (!list.length) {
    el.innerHTML = `<div style="padding:28px 16px; text-align:center; color:#7a7060; font-size:13px;">
      ${properties.length === 0 ? '物件を追加して始めましょう' : '該当する物件がありません'}</div>`;
    return;
  }
  el.innerHTML = list.map(p => {
    const meta = typeMeta(p.type);
    const sel = selectedId === p.id;
    const status = statusOf(p);
    const sm = statusMeta(status);
    const y = computeYield(p);
    const ar = areaOf(p);
    const pr = priceOf(p);
    const st = stationLabel(p);
    const bp = bestPlan(p);
    return `
      <div class="property-item ${sel ? 'selected' : ''}" data-id="${p.id}" style="${sel ? `border-left-color:${meta.color};` : ''}">
        <div class="name">${escapeHtml(p.name || '(無題)')}</div>
        <div style="margin-top:4px;">
          <span class="status-badge ${status}">${sm.short}</span>
          <span class="pill" style="background:${meta.bg}; color:${meta.text};">${p.type || '未設定'}</span>
          ${p.layout ? `<span class="li-sub">${p.layout}</span>` : ''}
          ${ar ? `<span class="li-sub">${ar}㎡</span>` : ''}
          ${p.age ? `<span class="li-sub">築${p.age}年</span>` : ''}
        </div>
        ${st ? `<div class="li-station">🚃 ${escapeHtml(st)}</div>` : ''}
        <div class="address">${escapeHtml(p.address || '住所未登録')}</div>
        ${pr ? `<div class="price">${formatYen(pr)}${y != null ? ` <span style="font-size:11px; color:#7a7060; font-weight:400;">利回り ${y.toFixed(2)}%</span>` : ''}</div>` : ''}
        ${bp ? `<div class="li-plan">
            ${escapeHtml(bp.pl.name || '企画')} 土地の売値 ${man(bp.c.revenue)}万${bp.c.buildCost > 0 ? ` ／ 建築費 ${man(bp.c.buildCost)}万` : ''}
          </div>` : ''}
        ${(p.agent || p.createdAt) ? `<div class="meta" style="margin-top:4px; display:flex; justify-content:space-between; gap:8px;">
          <span>${p.agent ? '担当: ' + escapeHtml(p.agent) : ''}</span>
          <span>${p.createdAt ? formatDate(p.createdAt) : ''}</span>
        </div>` : ''}
      </div>`;
  }).join('');
  el.querySelectorAll('.property-item').forEach(node =>
    node.addEventListener('click', () => selectProperty(node.dataset.id)));
}

/* ===== 詳細 ===== */
function plansDetailHtml(p) {
  const list = sortedPlans(p);
  if (!list.length) return '';
  return `<div style="margin-bottom:10px;">
    <div class="sec-label">企画検討</div>
    ${list.map(({ pl, c }) => `
      <div class="plan-detail ${pl.adopted ? 'adopted' : ''}">
        <div><span class="pname">${escapeHtml(pl.name || '企画')}</span>
          ${pl.adopted ? '<span class="tag">採用</span>' : ''}
          <span style="float:right; color:#7a7060;">${pl.sellType || ''} / ${c.units}区画</span></div>
        <div style="color:#5a5448;">
          土地の売値 ${man(c.revenue)}万${c.buildCost > 0 ? ` ／ 建築費 ${man(c.buildCost)}万` : ''}
          ${c.floorSum > 0 ? `／ 総延床 ${c.floorSum.toFixed(1)}㎡` : ''}
          ${c.totalLand > 0 && c.roadArea > 0 ? `／ 潰れ地 ${c.roadArea.toFixed(1)}㎡` : ''}
        </div>
      </div>`).join('')}
  </div>`;
}

function renderDetail() {
  const card = document.getElementById('detail-card');
  const p = properties.find(x => x.id === selectedId);
  if (!p) { card.style.display = 'none'; return; }
  card.style.display = 'block';
  const meta = typeMeta(p.type);
  const y = computeYield(p);
  const s = specOf(p.type);
  const row = (label, value) => value ? `<div class="detail-item"><div class="label">${label}</div><div class="value">${value}</div></div>` : '';

  card.innerHTML = `
    <div class="header-row">
      <h3>${escapeHtml(p.name || '(無題)')}</h3>
      <button class="close-btn" id="detail-close">×</button>
    </div>
    <div class="actions-row">
      <a href="${svUrl(p.lat, p.lng, p.address)}" target="_blank" rel="noopener noreferrer" class="btn-action btn-sv">👁 ストリートビュー</a>
      <a href="${gmUrl(p.lat, p.lng, p.address)}" target="_blank" rel="noopener noreferrer" class="btn-action btn-gm">🗺 Googleマップ</a>
    </div>
    <div class="detail-content">
      <div style="margin-bottom:10px;">
        <span class="status-badge ${statusOf(p)}">${statusMeta(statusOf(p)).name}</span>
        <span class="pill" style="background:${meta.bg}; color:${meta.text};">${p.type || '未設定'}</span>
      </div>
      ${(p.agent || p.createdAt) ? `<div class="meta-row">
        <span>${p.agent ? '担当: <span class="agent">' + escapeHtml(p.agent) + '</span>' : ''}</span>
        <span>${p.createdAt ? '入力: ' + formatDate(p.createdAt) : ''}${p.updatedAt && p.updatedAt !== p.createdAt ? ' (更新: ' + formatDate(p.updatedAt) + ')' : ''}</span>
      </div>` : ''}
      <div class="detail-address">${escapeHtml(p.address || '住所未登録')}</div>
      ${stationLabel(p) ? `<div class="detail-station">🚃 ${escapeHtml(stationLabel(p))}</div>` : ''}
      <div class="detail-grid">
        ${row('間取り', s.layout ? p.layout : '')}
        ${row('築年数', s.age && p.age ? p.age + ' 年' : '')}
        ${row('土地面積', s.land && p.landArea ? p.landArea + ' ㎡' : '')}
        ${row(p.type === '区分マンション' ? '専有面積' : '建物面積', s.bldg && p.bldgArea ? p.bldgArea + ' ㎡' : '')}
        ${row('建蔽率 / 容積率', s.bcr && (p.bcr || p.far) ? `${p.bcr || '—'} / ${p.far || '—'} %` : '')}
        ${row('価格', !s.lease && priceOf(p) ? formatYen(priceOf(p)) : '')}
        ${row('借地権価格', s.lease && p.leaseValue ? formatYen(p.leaseValue) : '')}
        ${row('建物価格', s.lease && p.bldgValue ? formatYen(p.bldgValue) : '')}
        ${row('総額', s.lease && priceOf(p) ? formatYen(priceOf(p)) : '')}
        ${row('月額地代', s.lease && p.groundRent ? Number(p.groundRent).toLocaleString() + '円' : '')}
        ${row('借地権', s.lease && p.leaseType ? p.leaseType + (p.leaseYears ? ` / 残${p.leaseYears}年` : '') : '')}
        ${row('月額家賃', s.income && p.monthlyRent ? Number(p.monthlyRent).toLocaleString() + '円' : '')}
        ${row('利回り', s.income && y != null ? y.toFixed(2) + ' %' : '')}
      </div>
      ${plansDetailHtml(p)}
      ${p.memo ? `<div class="memo-box">${escapeHtml(p.memo)}</div>` : ''}
      ${(p.attachments && p.attachments.length) ? `<div style="margin-bottom:10px;">
        <div class="sec-label">添付ファイル (${p.attachments.length})</div>
        <div class="attachments-grid" id="detail-attachments"></div></div>` : ''}
      <div class="edit-row">
        <button class="btn-secondary" id="detail-edit" style="flex:1; justify-content:center;">編集</button>
        <button class="btn-secondary" id="detail-delete" style="flex:1; justify-content:center; color:#b91c1c; border-color:#e5b4b4;">削除</button>
      </div>
    </div>`;

  if (p.attachments && p.attachments.length) {
    const attEl = document.getElementById('detail-attachments');
    attEl.innerHTML = p.attachments.map((a, i) => a.type && a.type.startsWith('image/')
      ? `<div class="attachment-item"><img src="${a.data}" alt="${escapeHtml(a.name)}" data-att-idx="${i}" /></div>`
      : `<a href="${a.data}" target="_blank" rel="noopener noreferrer" download="${escapeHtml(a.name)}" class="attachment-item pdf">
           <div class="pdf-icon">📄</div><div class="pdf-name">${escapeHtml(a.name)}</div></a>`).join('');
    attEl.querySelectorAll('img[data-att-idx]').forEach(img =>
      img.addEventListener('click', () => openLightbox(img.src)));
  }
  document.getElementById('detail-close').onclick = () => { selectedId = null; render(); syncMarkers(); };
  document.getElementById('detail-edit').onclick = () => openForm(p);
  document.getElementById('detail-delete').onclick = () => deleteProperty(p.id);
}

function render() {
  document.getElementById('count-badge').textContent = properties.length + ' 件';
  renderLegend();
  renderTypeFilter();
  renderList();
  renderDetail();
  updateBackupWarning();
}

/* ===== CSV ===== */
const CSV_HEADERS = ['物件名','住所','ステータス','担当者','物件種別','間取り','築年数',
  '土地面積(㎡)','建物面積(㎡)','建蔽率(%)','容積率(%)','価格(万円)',
  '借地権価格(万円)','建物価格(万円)','月額地代(円)','借地権種類','残存年数',
  '最寄駅','徒歩(分)','月額家賃(円)','利回り(%)','緯度','経度','メモ','入力日','最終更新','添付件数',
  '採用企画','売り方','区画数','区画別土地(㎡)','区画別延床(㎡)','区画別売価(万円)',
  '建築費(万円)','造成費(万円)','土地の売値(万円)'];

function exportCSV() {
  if (!properties.length) return;
  const rows = properties.map(p => {
    const b = bestPlan(p);
    const pl = b ? b.pl : null, c = b ? b.c : null;
    const y = computeYield(p);
    return [
      p.name, p.address, statusMeta(statusOf(p)).name, p.agent || '',
      p.type, p.layout, p.age,
      p.landArea || '', p.bldgArea || '', p.bcr || '', p.far || '', priceOf(p) || '',
      p.leaseValue || '', p.bldgValue || '', p.groundRent || '', p.leaseType || '', p.leaseYears || '',
      stationLabel(p), walkOf(p) ?? '',
      p.monthlyRent || '', y != null ? y.toFixed(2) : '',
      p.lat, p.lng, p.memo,
      p.createdAt ? formatDate(p.createdAt) : '', p.updatedAt ? formatDate(p.updatedAt) : '',
      (p.attachments || []).length,
      pl ? (pl.name || '') : '', pl ? (pl.sellType || '') : '', c ? c.units : '',
      pl ? (pl.lots || []).map(l => l.land).join(' / ')  : '',
      pl ? (pl.lots || []).map(l => l.floor).join(' / ') : '',
      pl ? (pl.lots || []).map(l => l.price).join(' / ') : '',
      c ? Math.round(c.buildCost) : '', c ? c.devCost : '',
      c ? c.revenue : '',
    ];
  });
  const csv = [CSV_HEADERS, ...rows]
    .map(r => r.map(c => `"${(c ?? '').toString().replace(/"/g, '""')}"`).join(','))
    .join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `properties_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

async function importCSV(file) {
  const rows = parseCSV(await file.text());
  if (rows.length < 2) { alert('CSVに有効なデータが見つかりませんでした'); return; }
  const headers = rows[0].map(h => h.trim());
  const idx = (n) => headers.indexOf(n);
  const C = {
    name: idx('物件名'), address: idx('住所'), status: idx('ステータス'), agent: idx('担当者'),
    type: idx('物件種別'), layout: idx('間取り'), age: idx('築年数'),
    landArea: idx('土地面積(㎡)'), bldgArea: idx('建物面積(㎡)'), areaOld: idx('面積(㎡)'),
    bcr: idx('建蔽率(%)'), far: idx('容積率(%)'), price: idx('価格(万円)'),
    leaseValue: idx('借地権価格(万円)'), bldgValue: idx('建物価格(万円)'),
    groundRent: idx('月額地代(円)'), leaseType: idx('借地権種類'), leaseYears: idx('残存年数'),
    station: idx('最寄駅'), walk: idx('徒歩(分)'),
    rent: idx('月額家賃(円)'), rentOld: idx('想定月額家賃(円)'), yield: idx('利回り(%)'),
    lat: idx('緯度'), lng: idx('経度'), memo: idx('メモ'),
    createdAt: idx('入力日'), updatedAt: idx('最終更新'),
  };
  if (C.name === -1 || C.address === -1) { alert('「物件名」「住所」の列が必要です'); return; }
  const get = (row, k) => C[k] >= 0 ? (row[C[k]] || '').trim() : '';

  const dataRows = rows.slice(1);
  if (!confirm(`${dataRows.length}件をインポートします。\n(物件名と住所が同じ既存物件はスキップされます)`)) return;

  const existing = new Set(properties.map(p => `${p.name}|${p.address}`));
  let imported = 0, skipped = 0;
  const now = new Date().toISOString();
  setSyncStatus('インポート中...', '#c9a961');

  for (const row of dataRows) {
    const name = get(row, 'name'), address = get(row, 'address');
    if (!name || !address) { skipped++; continue; }
    const key = `${name}|${address}`;
    if (existing.has(key)) { skipped++; continue; }
    existing.add(key);

    const type = get(row, 'type');
    const s = specOf(type);
    const areaOld = get(row, 'areaOld');
    let landArea = get(row, 'landArea'), bldgArea = get(row, 'bldgArea');
    if (!landArea && !bldgArea && areaOld) { if (s.land) landArea = areaOld; else bldgArea = areaOld; }

    const stName = get(row, 'station'), stMin = get(row, 'walk');
    const lat = parseFloat(get(row, 'lat')), lng = parseFloat(get(row, 'lng'));
    const createdAt = parseDate(get(row, 'createdAt')) || now;

    const data = {
      id: String(Date.now() + Math.random()), name, address,
      status: STATUS_NAME_TO_KEY[get(row, 'status')] || DEFAULT_STATUS,
      agent: get(row, 'agent'), type, layout: get(row, 'layout'), age: get(row, 'age'),
      landArea, bldgArea, area: landArea || bldgArea,
      bcr: get(row, 'bcr'), far: get(row, 'far'), price: get(row, 'price'),
      leaseValue: get(row, 'leaseValue'), bldgValue: get(row, 'bldgValue'),
      groundRent: get(row, 'groundRent'), leaseType: get(row, 'leaseType'), leaseYears: get(row, 'leaseYears'),
      stations: stName ? [{ line: '', name: stName, min: stMin }] : [],
      monthlyRent: get(row, 'rent') || get(row, 'rentOld'), yield: get(row, 'yield'),
      memo: get(row, 'memo'), plans: [], attachments: [],
      lat: !isNaN(lat) ? lat : null, lng: !isNaN(lng) ? lng : null,
      createdAt, updatedAt: parseDate(get(row, 'updatedAt')) || createdAt,
    };
    if (!data.lat || !data.lng) {
      const co = await geocode(address);
      if (co) { data.lat = co.lat; data.lng = co.lng; }
      await new Promise(r => setTimeout(r, 120));
    }
    if (await savePropertyToFirestore(data)) imported++; else skipped++;
  }
  setSyncStatus('● 同期済み', '#1D9E75');
  alert(`${imported}件を取り込みました${skipped ? `\n(${skipped}件はスキップ)` : ''}`);
}


/* ===== 絞り込みUIの配線 ===== */
function setupFilterUI() {
  const ids = ['search-input','type-filter','status-filter','sort-select',
               'f-price-min','f-price-max','f-area-min','f-area-max','f-walk-max'];
  ids.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('input',  () => { readFilterInputs(); renderList(); syncMarkers(); });
    el.addEventListener('change', () => { readFilterInputs(); renderList(); syncMarkers(); });
  });
  const b = document.getElementById('f-in-bounds');
  if (b) b.addEventListener('change', () => { readFilterInputs(); renderList(); syncMarkers(); });
  const r = document.getElementById('radius-select');
  if (r) r.addEventListener('change', () => { readFilterInputs(); updateRadiusCircle(); renderList(); syncMarkers(); });
  const c = document.getElementById('filter-clear');
  if (c) c.addEventListener('click', clearFilters);
  const t = document.getElementById('adv-toggle');
  const body = document.getElementById('adv-body');
  if (t && body) t.addEventListener('click', () => {
    const on = body.style.display === 'none';
    body.style.display = on ? 'block' : 'none';
    t.textContent = on ? '− 詳細条件' : '＋ 詳細条件';
  });
  const bk = document.getElementById('backup-btn');
  if (bk) bk.addEventListener('click', openBackupModal);
  const wb = document.getElementById('warn-backup-btn');
  if (wb) wb.addEventListener('click', openBackupModal);
  readFilterInputs();
}
document.addEventListener('DOMContentLoaded', setupFilterUI);
if (document.readyState !== 'loading') setupFilterUI();

</script>
